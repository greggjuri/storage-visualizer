[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-visualizer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["psutil>=6.0", "PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-cov", "ruff"]

[project.scripts]
storage-visualizer = "storage_visualizer.ui.app:main"

[tool.setuptools.packages.find]
include = ["storage_visualizer*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
